# Equivalente en GitHub Actions de los templates de GitLab
#   Security/SAST.gitlab-ci.yml + Security/Secret-Detection.gitlab-ci.yml
# SAST: Semgrep + Bandit. Secretos: la imagen oficial del analizador de GitLab.
# (ver .gitlab-ci.yml, que queda listo para cuando el repo pase a GitLab).
name: security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  # SAST: igual que en GitLab, el job publica el reporte pero no corta el
  # pipeline (el codigo es vulnerable a proposito). Los hallazgos quedan en el
  # artifact y en el resumen del job.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet semgrep==1.144.0 pydantic==2.11.10 bandit==1.9.4
      - name: semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan --metrics=off \
            --config p/security-audit --config p/python --config p/secrets \
            --exclude server/tests --json --output gl-sast-report.json server/
          semgrep scan --metrics=off \
            --config p/security-audit --config p/python --config p/secrets \
            --exclude server/tests --text server/ | tee -a "$GITHUB_STEP_SUMMARY"
      - name: bandit
        run: |
          bandit -r server -x server/tests -f json -o bandit-report.json || true
          bandit -r server -x server/tests -f txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            gl-sast-report.json
            bandit-report.json

  # Secret detection: misma imagen que el template de GitLab
  # (Gitleaks + reglas de GitLab), publica gl-secret-detection-report.json y
  # falla si encuentra algo. README.md se excluye porque el enunciado trae la
  # clave de ejemplo de AWS (falso positivo, ver SAST.md).
  secret_detection:
    runs-on: ubuntu-latest
    env:
      SECRET_DETECTION_EXCLUDED_PATHS: "README.md"
    steps:
      - uses: actions/checkout@v4
      - name: secrets (analizador de GitLab Secret Detection)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e CI_PROJECT_DIR=/src -e SECRET_DETECTION_EXCLUDED_PATHS \
            registry.gitlab.com/security-products/secrets:6 /analyzer run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-detection-report
          path: gl-secret-detection-report.json
      - name: falla si hay secretos
        run: |
          n=$(jq '.vulnerabilities | length' gl-secret-detection-report.json)
          {
            echo "### Secret detection: $n hallazgos"
            echo
            jq -r '.vulnerabilities[] | "- **\(.name)** en `\(.location.file):\(.location.start_line)`"' gl-secret-detection-report.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo "::error::Secret detection encontro $n secreto(s). Revocar/rotar la credencial: borrarla del codigo no alcanza."
            exit 1
          fi

  # SCA: dependencias con CVEs conocidas.
  dependency_scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pip-audit
      - run: pip-audit -r server/requirements.txt -f json -o gl-dependency-scanning-report.json || true
      - run: pip-audit -r server/requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scanning-report
          path: gl-dependency-scanning-report.json
