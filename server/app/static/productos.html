<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>TiendaVulnerable — Productos</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 0 1rem 2rem; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.3rem; margin: 0; }
    #perfilBar { font-size: 0.95rem; color: #333; }
    #perfilBar .vip { color: #a86b00; font-weight: 600; }
    #logout { cursor: pointer; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .producto { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .producto h3 { margin: 0; text-transform: capitalize; }
    .producto .precio { font-size: 1.1rem; font-weight: 600; }
    .producto button { padding: 0.5rem; cursor: pointer; }
    .resultado { font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; }
    .ok { color: #1a7f37; }
    .err { color: #b00020; }
    footer { margin-top: 2rem; font-size: 0.85rem; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>🛍️ TiendaVulnerable</h1>
    <div id="perfilBar">Cargando perfil…</div>
    <button id="logout">Cerrar sesión</button>
  </header>

  <section id="catalogo" class="grid">Cargando catálogo…</section>

  <footer>¿Sos alumno resolviendo el desafío? <a href="/alumno-devtools">Herramientas de inspección →</a></footer>

  <script src="productos.js"></script>
</body>
</html>
